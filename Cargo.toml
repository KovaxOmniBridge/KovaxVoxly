[package]
name = "Voxly"
version = "0.1.0"
edition = "2021"

[dependencies]
# Áudio e Buffers
cpal = "0.15"
ringbuf = "0.3"

# Async e Arquivos Temporários
tokio = { version = "1", features = ["full"] }
tempfile = "3.10"

# CLI e JSON
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Gerenciamento de Registro
winreg = "0.11"
hound = "3.5.1"
crossterm = "0.29.0"
futures-util = { version = "0.3.32", features = ["sink"] }
tokio-tungstenite = "0.28.0"
bytes = "1.11.1"
